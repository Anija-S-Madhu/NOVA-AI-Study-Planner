{% extends 'base.html' %}{% block content %}<div class="form-card"><span class="eyebrow">CURRICULUM</span><h2>Add a subject</h2><form method="post"><label>Subject name</label><input class="form-control" name="subject" required><label>Exam date</label><input class="form-control" type="date" name="exam_date" required><label>Difficulty</label><select class="form-select" name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select><label>Recommended daily hours</label><input class="form-control" type="number" min="1" max="12" name="study_hours" value="2" required><button class="btn btn-accent mt-3">Save subject</button></form></div>{% endblock %}
