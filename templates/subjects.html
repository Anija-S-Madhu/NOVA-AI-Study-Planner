{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">CURRICULUM</span><h2>My subjects</h2></div><a class="btn btn-accent" href="{{url_for('add_subject')}}">Add subject</a></div><div class="panel table-responsive"><table class="table align-middle"><thead><tr><th>Subject</th><th>Exam</th><th>Difficulty</th><th>Daily target</th><th></th></tr></thead><tbody>{% for s in subjects %}<tr><td><strong>{{s.subject}}</strong></td><td>{{s.exam_date}}</td><td><span class="badge badge-{{s.difficulty|lower}}">{{s.difficulty}}</span></td><td>{{s.study_hours}} hours</td><td><form method="post" action="{{url_for('delete_subject',subject_id=s.id)}}" onsubmit="return confirm('Delete this subject and its sessions?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="5" class="text-center text-muted py-4">Add your first subject to create a plan.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
