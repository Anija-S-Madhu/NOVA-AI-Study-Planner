{% extends 'base.html' %}{% block content %}<div class="row g-4"><div class="col-lg-5"><div class="form-card"><span class="eyebrow">ACTION PLAN</span><h2>New task</h2><form method="post"><label>Task</label><input class="form-control" name="title" required><label>Subject</label><select class="form-select" name="subject_id"><option value="">General</option>{% for s in subjects %}<option value="{{s.id}}">{{s.subject}}</option>{% endfor %}</select><label>Topic / module</label><input class="form-control" name="topic"><label>Deadline</label><input class="form-control" type="date" name="due_date"><label>Priority</label><select class="form-select" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select><button class="btn btn-accent mt-3">Add task</button></form></div></div><div class="col-lg-7"><div class="panel"><h2>Study tasks</h2>{% for t in tasks %}<div class="item"><form method="post" action="{{url_for('toggle_task',task_id=t.id)}}"><button class="check {{'checked' if t.completed}}"><i class="fa fa-check"></i></button></form><div class="flex-grow-1 {{'done' if t.completed}}"><strong>{{t.title}}</strong><small>{{t.subject or 'General'}}{% if t.topic %} · {{t.topic}}{% endif %}</small></div><span class="badge text-bg-light">{{t.priority}}</span></div>{% else %}<p class="text-muted">No tasks yet.</p>{% endfor %}</div></div></div>{% endblock %}
